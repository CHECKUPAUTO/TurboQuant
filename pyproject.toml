[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turboquant"
version = "0.1.0"
description = "3-bit KV Cache Compression for LLM inference"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pylint>=2.17.0",
    "ruff>=0.1.0",
]
bench = [
    "triton>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/CHECKUPAUTO/TurboQuant"
Repository = "https://github.com/CHECKUPAUTO/TurboQuant"

# The distribution is the single top-level module turboquant.py; without
# this, setuptools' flat-layout auto-discovery aborts on the rust/,
# legacy/ and deploy/ directories.
[tool.setuptools]
py-modules = ["turboquant"]

# Collect only tests/ — legacy/python/ keeps a deprecated copy of the
# prototype whose tests must not run.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.pylint.format]
max-line-length = 100
