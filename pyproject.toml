[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "turboquant"
version = "0.1.0"
description = "3-bit KV Cache Compression for LLM inference"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pylint>=2.17.0",
    "ruff>=0.1.0",
]
bench = [
    "triton>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/CHECKUPAUTO/TurboQuant"
Repository = "https://github.com/CHECKUPAUTO/TurboQuant"

[tool.ruff]
line-length = 100

[tool.pylint.format]
max-line-length = 100
