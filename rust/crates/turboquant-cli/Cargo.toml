[package]
name = "turboquant-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TurboQuant CLI: compress, verify, bench, calibrate, audit, daemon, info"

[[bin]]
name = "turboquant"
path = "src/main.rs"

[dependencies]
turboquant-core = { path = "../turboquant-core" }
turboquant-cpu = { path = "../turboquant-cpu" }
turboquant-gguf = { path = "../turboquant-gguf" }
turboquant-daemon = { path = "../turboquant-daemon" }
clap = { workspace = true, features = ["derive"] }
indicatif.workspace = true
colored.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
rayon.workspace = true
rand.workspace = true
num_cpus = "1"
anstyle = "1"

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true

[lints.clippy]
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"
