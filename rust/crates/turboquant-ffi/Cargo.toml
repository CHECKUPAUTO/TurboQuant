[package]
name = "turboquant-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "C FFI bindings for TurboQuant"

[lib]
# rlib is included so Rust integration tests can link against the crate;
# the shipped artifacts are the cdylib and staticlib.
crate-type = ["cdylib", "staticlib", "rlib"]

[build-dependencies]
cbindgen.workspace = true

[dependencies]
turboquant-core = { path = "../turboquant-core" }
half.workspace = true

[dev-dependencies]
tempfile.workspace = true
